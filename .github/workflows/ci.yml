name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: cineops validate examples/glass-elevator
      - run: cineops evidence examples/glass-elevator
      - run: cineops report examples/glass-elevator --output .cineops-report.html
      - run: cineops demo .cineops-demo
      - name: Confirm broken fixture is rejected
        run: python -c "import subprocess, sys; sys.exit(0 if subprocess.run(['cineops', 'validate', 'examples/broken-handoff']).returncode else 1)"
