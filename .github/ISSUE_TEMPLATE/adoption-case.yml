name: Production adoption report
description: Share an anonymized real production case or propose one for validation.
title: "[Adoption]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing CineOps in a real workflow. Do not include private scripts, unreleased media, credentials, client names, or copyrighted material without permission. An anonymized summary is welcome.
  - type: dropdown
    id: relationship
    attributes:
      label: Relationship to the production
      options:
        - Creator or production team member
        - Tool integrator or consultant
        - Researcher or evaluator
        - Public-project maintainer
        - Other authorized participant
    validations:
      required: true
  - type: dropdown
    id: maintainer_relationship
    attributes:
      label: Relationship to the CineOps maintainers
      description: This is used to separate independent adoption from maintainer testing.
      options:
        - Independent; no ownership, employment, or project control relationship
        - External collaborator or client relationship
        - CineOps maintainer or maintainer-controlled project
        - Unsure; please review before classifying
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CineOps version or commit
      placeholder: "Example: 0.1.1 or a full commit SHA"
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Production scope
      description: Format, approximate runtime, and number of scenes or shots. Keep identities anonymous when needed.
      placeholder: "Example: 3-minute vertical short, 8 scenes, 31 planned shots"
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Where CineOps was used
      description: Name the skills, CLI commands, and production stages actually used.
      placeholder: "Screenplay diagnosis -> shot planning -> continuity ledger -> readiness review"
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Baseline workflow or failure mode
      description: Describe what happened before CineOps, or what you expected to test.
      placeholder: "Example: continuity review was manual and prop handoff errors were found only after generation"
    validations:
      required: true
  - type: textarea
    id: observed_result
    attributes:
      label: Observed result
      description: Report measured or directly observed changes. Separate evidence from interpretation.
      placeholder: "Include avoided regenerations, defects found, review time, or handoff changes. State when no improvement was observed."
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: What failed or remained difficult
      description: A useful adoption report includes friction, false positives, missed defects, and abandoned steps.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproducible evidence
      description: Link public artifacts or describe the anonymized fixture you can contribute.
      placeholder: "Paste cineops-evidence.json in a fenced JSON block, or link a public/anonymized fixture"
    validations:
      required: true
  - type: dropdown
    id: requested_level
    attributes:
      label: Evidence available for review
      options:
        - Authorized report only (candidate Level 1)
        - Privacy-safe evidence JSON or anonymized artifacts (candidate Level 2)
        - Public reproducible project or independent integration (candidate Level 3)
        - Unsure; maintainer should classify
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Permissions and privacy
      options:
        - label: I have permission to share every public artifact linked in this report.
          required: true
        - label: I removed credentials, private identifiers, and confidential production material.
          required: true
        - label: I understand that unverified claims will be labeled as self-reported.
          required: true
        - label: I reviewed all pasted output and attachments for sensitive information.
          required: true
